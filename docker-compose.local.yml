# Local-only overrides: publish ports to the host so you can open the app in a browser.
# Coolify IGNORES this file (it deploys with docker-compose.yml only and routes
# traffic by domain through its own proxy), so host-port conflicts on the server
# can never happen.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up --build
#   front -> http://localhost:3000 | api -> http://localhost:8000/up

services:
  api:
    ports:
      - "8000:80"
  front:
    ports:
      - "3000:80"
